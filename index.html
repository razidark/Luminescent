                '50%': { transform: 'scale(1.05)', boxShadow: '0 0 10px 5px color-mix(in srgb, var(--theme-accent) 20%, transparent)' }
              },
              'fade-in': {
                'from': { opacity: '0', transform: 'translateY(10px)' },
                'to': { opacity: '1', transform: 'translateY(0)' }
              },
              'float-up': {

                '10%': { opacity: '0.6' },
                '90%': { opacity: '0.4' },
                '100%': { transform: 'translateY(-80vh) scale(0.5)', opacity: '0' }
              },
              'blink': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' }
              },
              'gradient-shift': {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' }
              }
            }
          }
        }
      }
    </script>

  <script>
    // To prevent Flash Of Incorrect Theme (FOIT), this script must be in the <head>
    if (localStorage.getItem('luminescenceMode') === 'dark' || (!('luminescenceMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>

</head>
  <body class="bg-gray-100 dark:bg-[#0a0a0a]">
    <canvas id="gradient-canvas" class="fixed inset-0 -z-10 dark:hidden"></canvas>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Gradient background animation for light mode
      const canvas = document.getElementById('gradient-canvas');
      if (canvas && !document.documentElement.classList.contains('dark')) {
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        let blobs = [];

        const blobColors = [
          { r: 233, g: 213, b: 255 }, // light purple
          { r: 253, g: 230, b: 242 }, // light pink
          { r: 224, g: 242, b: 254 }  // light blue
        ];

        class Blob {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = Math.random() * (Math.max(width, height) / 4) + (Math.max(width, height) / 6);
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.color = blobColors[Math.floor(Math.random() * blobColors.length)];
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x - this.radius < 0) {
              this.vx = Math.abs(this.vx); this.x = this.radius;
            } else if (this.x + this.radius > width) {
              this.vx = -Math.abs(this.vx); this.x = width - this.radius;
            }
            if (this.y - this.radius < 0) {
              this.vy = Math.abs(this.vy); this.y = this.radius;
            } else if (this.y + this.radius > height) {
              this.vy = -Math.abs(this.vy); this.y = height - this.radius;
            }
          }
        }

        let animationFrameId;
        function init() {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          dpr = window.devicePixelRatio || 1;
          width = canvas.width = window.innerWidth * dpr;
          height = canvas.height = window.innerHeight * dpr;
          canvas.style.width = `${window.innerWidth}px`;
          canvas.style.height = `${window.innerHeight}px`;
          blobs = Array(3).fill().map(() => new Blob());
          animate();
        }

        function animate() {
          ctx.clearRect(0, 0, width, height);
          
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = width;
          tempCanvas.height = height;
          const tempCtx = tempCanvas.getContext('2d');
          
          tempCtx.filter = 'blur(80px)';
          blobs.forEach(blob => {
            blob.update();
            tempCtx.fillStyle = `rgb(${blob.color.r}, ${blob.color.g}, ${blob.color.b})`;
            tempCtx.beginPath();
            tempCtx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
            tempCtx.fill();
          });
          
          ctx.drawImage(tempCanvas, 0, 0);

          animationFrameId = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
      }

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registered successfully:', reg.scope);
              // Force update check on register
              reg.update();
            })
            .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
