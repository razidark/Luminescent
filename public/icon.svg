<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#180b2c" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>
    <!-- Core Glow Gradient -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="ring" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Glow Filter for Glowing Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Ring (Rotating style) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="8" stroke-dasharray="20 15 40 10" filter="url(#neon-glow)" opacity="0.8" />

  <!-- Inner Tech Elements -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" />
  
  <!-- Core Luminescent Circle -->
  <circle cx="256" cy="256" r="90" fill="url(#glow)" filter="url(#neon-glow)" />

  <!-- Dynamic Energy Arcs -->
  <path d="M 256,110 A 146,146 0 0,1 402,256" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
  <path d="M 256,402 A 146,146 0 0,1 110,256" fill="none" stroke="#d946ef" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
</svg>
